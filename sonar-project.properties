# SonarQube Cloud analysis runs in .github/workflows/ci.yml.
sonar.organization=maxthomas95
sonar.projectKey=maxthomas95_tether
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Retain repository-wide static analysis, with explicit test classification.
sonar.sources=.
sonar.tests=src,scripts
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test-helper.ts,src/**/__mocks__/**,scripts/**/*.test.mjs
sonar.exclusions=index.html,docs-window.html,src/**/*.test.ts,src/**/*.test-helper.ts,src/**/__mocks__/**,scripts/**/*.test.mjs,**/node_modules/**,coverage/**,.scannerwork/**,out/**,dist/**,.vite/**

# Preserve the automatic-analysis exclusions for intentional data tables.
sonar.cpd.exclusions=src/renderer/styles/themes.ts,src/shared/loader-themes.ts,src/docs-renderer/index.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Vitest measures application TS/TSX; tooling and the separately built Helm
# server remain statically analyzed, but are not part of this coverage suite.
sonar.coverage.exclusions=scripts/**,mcp-servers/**,*.ts,*.js,*.mjs,src/**/*.d.ts
