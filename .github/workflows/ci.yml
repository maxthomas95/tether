name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Keep this context name stable: the main ruleset requires `tests`.
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 24 matches Electron 44's runtime and provides the built-in
          # node:sqlite the Crush usage reader uses.
          node-version: '24'
          cache: 'npm'
      # Node 24 bundles npm 11, whose arborist trips on this dependency tree
      # during `npm ci` ("Invalid Version"). Pin npm 10 until that is fixed
      # upstream; 10.9.x supports Node >=20.5.
      - run: npm i -g npm@10.9.4 --ignore-scripts
      - run: npm ci --ignore-scripts
      # Tests import Electron and node-pty; run only their pinned setup.
      - name: Prepare pinned native test dependencies
        run: |
          node node_modules/electron/install.js
          cd node_modules/node-pty
          node scripts/prebuild.js || ../.bin/node-gyp rebuild
          node scripts/post-install.js
      - run: npm run postinstall
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - name: Upload test coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 7
      - run: npm run test:packaging
      - run: npm run test:security

  sonar:
    name: SonarQube scan
    needs: test
    timeout-minutes: 10
    # Fork and Dependabot PRs do not receive the repository's Sonar token.
    # Their tests and coverage still run; merged code is scanned on main.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage
          path: coverage/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Read project release version
        id: project
        run: node -e 'console.log("version=" + require("./package.json").version)' >> "$GITHUB_OUTPUT"
      - name: Check Sonar token configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Configure the SONAR_TOKEN Actions secret. See docs/SONAR.md."
            exit 1
          fi
          test -s coverage/lcov.info
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        timeout-minutes: 5
        with:
          args: >-
            -Dsonar.projectVersion=${{ steps.project.outputs.version }}
            -Dsonar.verbose=${{ vars.SONAR_VERBOSE == 'true' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm i -g npm@10.9.4 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: node node_modules/patch-package/index.js --error-on-fail
      - run: npm run test:security
      - run: npm run audit:security
      - run: npm audit --omit=dev --audit-level=high

  helm:
    name: helm build · audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-servers/tether-helm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mcp-servers/tether-helm/package-lock.json
      - run: npm i -g npm@10.9.4 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm audit --audit-level=high

  package:
    name: windows package + verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm i -g npm@10.9.4 --ignore-scripts
      - run: npm ci
      - run: npm run test:packaging
      # Produce a real package and assert its ASAR/resources are complete.
      # A bare `npm run package` success does not prove the packaged app is
      # functional; verify:package opens the asar and checks that every
      # bare-required module, native binding, and extra resource is present.
      - run: npm run package
      - run: npm run verify:package
      - name: Exercise the packaged Windows app
        run: npm run smoke:windows
      - name: Upload Windows smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-smoke-diagnostics
          path: out/smoke-windows/
          if-no-files-found: ignore
          retention-days: 7
