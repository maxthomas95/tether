version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      npm-version-nonmajors:
        applies-to: "version-updates"
        update-types:
          - "patch"
          - "minor"
      npm-security-nonmajors:
        applies-to: "security-updates"
        update-types:
          - "patch"
          - "minor"
      npm-security-majors:
        applies-to: "security-updates"
        update-types:
          - "major"

  - package-ecosystem: "npm"
    directory: "/mcp-servers/tether-helm"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      tether-helm-version-nonmajors:
        applies-to: "version-updates"
        update-types:
          - "patch"
          - "minor"
      tether-helm-security-nonmajors:
        applies-to: "security-updates"
        update-types:
          - "patch"
          - "minor"
      tether-helm-security-majors:
        applies-to: "security-updates"
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      github-actions-version-nonmajors:
        applies-to: "version-updates"
        update-types:
          - "patch"
          - "minor"
      github-actions-security-nonmajors:
        applies-to: "security-updates"
        update-types:
          - "patch"
          - "minor"
      github-actions-security-majors:
        applies-to: "security-updates"
        update-types:
          - "major"
