<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-6qdN/3tXDmoPyxhxo6tXxpao2pCLfKbuaydcJghJE7I='; style-src 'self' 'sha256-geK75pRI1sVjoOCR7D66pNgQxUZK5oS07RN1dYN9cHQ='; style-src-elem 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" />
    <title>Tether</title>
    <script>
      // Main supplies a validated palette for built-in and local themes alike.
      (function () {
        try {
          var params = new URLSearchParams(location.search);
          var palette = JSON.parse(params.get('palette') || '{}');
          var root = document.documentElement;
          var allowed = ['--bg-primary', '--bg-sidebar', '--bg-header', '--bg-hover', '--bg-active', '--text-primary', '--text-secondary', '--text-muted', '--border-color', '--accent', '--status-running', '--status-waiting', '--status-idle', '--status-dead', '--btn-primary-text', '--surface-1', '--surface-2', '--surface-3', '--surface-4'];
          allowed.forEach(function (key) {
            if (typeof palette[key] === 'string' && /^#[\da-f]{6}([\da-f]{2})?$/i.test(palette[key])) root.style.setProperty(key, palette[key]);
          });
          if (/^(0(\.\d+)?|1(\.0+)?)$/.test(palette['--shadow-opacity'])) root.style.setProperty('--shadow-opacity', palette['--shadow-opacity']);
          var dark = params.get('dark') !== 'false';
          root.style.colorScheme = dark ? 'dark' : 'light';
          root.style.setProperty('--inner-highlight', dark ? 'inset 0 1px 0 rgba(255, 255, 255, 0.04)' : '0 0 0 0 transparent');
          root.dataset.theme = params.get('theme') || 'mocha';
        } catch (_) { /* Keep the default palette if startup data is unavailable. */ }
      })();
    </script>
    <style>
      /* Inline boot styles — applied before global.css loads so the
         loading screen paints on the very first frame. React replaces
         #root's contents on mount, so this disappears automatically. */
      html, body, #root {
        height: 100%;
        margin: 0;
        background: var(--bg-primary, #1e1e2e);
        color: var(--text-primary, #cdd6f4);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }
      .tether-boot {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        -webkit-app-region: drag;
        user-select: none;
      }
      .tether-boot__title {
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.08em;
        color: var(--text-primary, #cdd6f4);
      }
      .tether-boot__sub {
        font-size: 12px;
        color: var(--text-muted, #a0a4ba);
      }
      .tether-boot__spinner {
        width: 28px;
        height: 28px;
        border: 2px solid var(--border-color, #313244);
        border-top-color: var(--accent, #b4befe);
        border-radius: 50%;
        animation: tether-boot-spin 0.8s linear infinite;
      }
      @keyframes tether-boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="tether-boot">
        <div class="tether-boot__spinner"></div>
        <div class="tether-boot__title">TETHER</div>
        <div class="tether-boot__sub">Loading workspace&hellip;</div>
      </div>
    </div>
    <script type="module" src="/src/renderer/index.tsx"></script>
  </body>
</html>
